<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDR Net Tracer</title>
<style>
  :root { color-scheme: dark; --bg:#111316; --panel:#181b20; --text:#f0f3f6; --muted:#9aa4af; --border:#30343b; --button:#262b33; --buttonActive:#73b8ff; --buttonActiveText:#06111f; --top:#ff4d4d; --bottom:#4aa3ff; --other:#ffd166; --ddr:#f7cc45; --zynq:#8dd26e; --passive:#b8bec7; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  .app { height:100vh; display:flex; flex-direction:column; padding:14px; gap:10px; }
  .toolbar { flex:0 0 auto; display:grid; grid-template-columns:minmax(260px,1fr) auto auto; gap:10px; align-items:end; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  select { width:100%; min-height:38px; border:1px solid var(--border); border-radius:8px; background:var(--panel); color:var(--text); padding:6px 10px; font-size:15px; }
  .buttons { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  button { min-height:38px; border:1px solid var(--border); border-radius:8px; background:var(--button); color:var(--text); padding:7px 11px; font-size:14px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--buttonActive); color:var(--buttonActiveText); border-color:var(--buttonActive); }
  button:hover { filter:brightness(1.08); }
  .detail { flex:0 0 auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:15px; }
  .detail strong { color:var(--text); font-weight:600; }
  .stage { flex:1 1 auto; min-height:0; border:1px solid var(--border); border-radius:10px; background:#151719; overflow:hidden; position:relative; }
  svg { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  svg.dragging { cursor:grabbing; }
  .bg-seg { stroke:var(--muted); opacity:.18; cursor:pointer; }
  .bg-pad { fill:#2a2e34; stroke:var(--border); opacity:.55; cursor:pointer; }
  .bg-via { fill:#151719; stroke:var(--muted); opacity:.35; cursor:pointer; }
  .sel-top { stroke:var(--top); }
  .sel-bottom { stroke:var(--bottom); }
  .sel-other { stroke:var(--other); }
  .sel-via { fill:#151719; stroke:var(--text); }
  .pad-ddr { fill:var(--ddr); stroke:var(--text); }
  .pad-zynq { fill:var(--zynq); stroke:var(--text); }
  .pad-passive { fill:var(--passive); stroke:var(--text); }
  .label { fill:var(--text); font-weight:600; paint-order:stroke; stroke:#151719; stroke-width:.22; }
  .corner { position:absolute; right:10px; bottom:8px; color:var(--muted); font-size:12px; pointer-events:none; background:rgba(17,19,22,.72); padding:4px 7px; border-radius:6px; }
  @media (max-width:900px) { .toolbar { grid-template-columns:1fr; } .buttons { justify-content:flex-start; } body { overflow:auto; } .app { min-height:100vh; height:auto; } .stage { height:70vh; min-height:420px; flex:none; } }
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div>
      <label for="netSelect">选择要追踪的 DDR net</label>

      <button type="button" data-group="DATA" aria-pressed="false">DATA</button>
      <button type="button" data-group="ADDR" aria-pressed="false">ADDR</button>
      <button type="button" data-group="CTRL" aria-pressed="false">CTRL</button>
    </div>
    <div class="buttons" aria-label="视图控制">
      <button type="button" id="fitNet">适应当前线</button>
      <button type="button" id="fitAll">全图</button>
      <button type="button" id="zoomIn">放大</button>
      <button type="button" id="zoomOut">缩小</button>
    </div>
  </div>
  <div class="detail" id="detail"></div>
  <div class="stage">
    <svg id="traceSvg" role="img" aria-label="DDR net trace viewer"></svg>
    <div class="corner">滚轮缩放，拖动画布，点击灰线可切换 net</div>
  </div>
</div>

  const sorted = () => data.nets.filter(n => group === 'ALL' || n.group === group).sort((a,b) => a.group.localeCompare(b.group) || a.name.localeCompare(b.name, undefined, {numeric:true}));
  function E(name, attrs) { const node = document.createElementNS(ns, name); Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k,v)); return node; }
  function layerClass(layer) { if (layer.includes('Top') || layer.includes('F.Cu')) return 'sel-top'; if (layer.includes('Bottom') || layer.includes('B.Cu')) return 'sel-bottom'; return 'sel-other'; }
  function bboxFor(net) {
    const xs=[], ys=[];
    net.segments.forEach(s => { xs.push(s.x1,s.x2); ys.push(s.y1,s.y2); });
    net.vias.forEach(v => { xs.push(v.x); ys.push(v.y); });
    net.pads.forEach(p => { xs.push(p.x); ys.push(p.y); });
    let minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
    const pad=Math.max(1.2, Math.max(maxX-minX, maxY-minY)*0.09);
    minX-=pad; maxX+=pad; minY-=pad; maxY+=pad;
    return {x:minX,y:minY,w:maxX-minX,h:maxY-minY};
  }
  function setView(v) {
    const box = svg.getBoundingClientRect();
    const svgRatio = Math.max(0.1, box.width / Math.max(1, box.height));
    const viewRatio = v.w / v.h;
    let x=v.x, y=v.y, w=v.w, h=v.h;
    if (viewRatio > svgRatio) { h = w / svgRatio; y = v.y + (v.h - h)/2; } else { w = h * svgRatio; x = v.x + (v.w - w)/2; }
    view = {x,y,w,h};
    svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  }
  function fitSelected() { const n=data.nets.find(x => x.name === selectedName); if (n) setView(bboxFor(n)); }
  function fitWhole() { setView(whole); }
  function rebuildSelect(current) {
    select.innerHTML='';
    const items=sorted();
    items.forEach(n => { const opt=document.createElement('option'); opt.value=n.name; opt.textContent=`${n.group} · ${nice(n.name)}`; select.appendChild(opt); });
    if (!items.some(n => n.name === current)) current = items[0]?.name;
    choose(current || selectedName, true);
  }
  function clickToChoose(node, name) { node.addEventListener('click', ev => { ev.stopPropagation(); choose(name); }); const t=E('title',{}); t.textContent=name; node.appendChild(t); }
  function draw() {
    svg.innerHTML='';
    const selected=data.nets.find(n => n.name === selectedName);
    if (!selected) return;
    data.nets.forEach(n => {
      if (group !== 'ALL' && n.group !== group && n.name !== selectedName) return;
      n.segments.forEach(s => { const line=E('line',{x1:s.x1,y1:s.y1,x2:s.x2,y2:s.y2,class:'bg-seg','stroke-width':Math.max(0.05,s.w*.9),'stroke-linecap':'round'}); clickToChoose(line,n.name); svg.appendChild(line); });
      n.vias.forEach(v => { const c=E('circle',{cx:v.x,cy:v.y,r:.12,class:'bg-via','stroke-width':.035}); clickToChoose(c,n.name); svg.appendChild(c); });
      n.pads.forEach(p => { const c=E('circle',{cx:p.x,cy:p.y,r:.11,class:'bg-pad','stroke-width':.025}); clickToChoose(c,n.name); svg.appendChild(c); });
    });
    selected.segments.forEach(s => svg.appendChild(E('line',{x1:s.x1,y1:s.y1,x2:s.x2,y2:s.y2,class:layerClass(s.layer),'stroke-width':Math.max(0.11,s.w*1.7),'stroke-linecap':'round'})));
    selected.vias.forEach(v => svg.appendChild(E('circle',{cx:v.x,cy:v.y,r:.22,class:'sel-via','stroke-width':.04})));
    selected.pads.forEach(p => {
      const cls=p.role==='ddr'?'pad-ddr':(p.role==='zynq'?'pad-zynq':'pad-passive');
      svg.appendChild(E('circle',{cx:p.x,cy:p.y,r:p.role==='passive'?.17:.23,class:cls,'stroke-width':.035}));
      if (p.role !== 'passive') { const txt=E('text',{x:p.x+.28,y:p.y+(p.role==='ddr' ? -.25 : .42),class:'label','font-size':'.55'}); txt.textContent=`${p.ref} ${p.pad}`; svg.appendChild(txt); }
    });
    const top=selected.segments.filter(s => s.layer.includes('Top') || s.layer.includes('F.Cu')).length;
    const bottom=selected.segments.filter(s => s.layer.includes('Bottom') || s.layer.includes('B.Cu')).length;
    const pads=selected.pads.map(p => `${p.ref}:${p.pad}`).join('  ');
    detail.innerHTML=`<strong>${selected.group} · ${selected.name}</strong><span>长度约 ${selected.length} mm</span><span>线段 ${selected.segments.length}</span><span>过孔 ${selected.vias.length}</span><span>Top ${top} / Bottom ${bottom}</span><span>${pads}</span>`;
  }
  function choose(name, keepView=false) { selectedName=name; select.value=name; draw(); if (!keepView || !view) fitMode === 'net' ? fitSelected() : fitWhole(); }
  function zoomAt(factor, cx, cy) {
    if (!view) fitSelected();
    const rect=svg.getBoundingClientRect();
    const px=(cx-rect.left)/rect.width, py=(cy-rect.top)/rect.height;
    const mx=view.x+px*view.w, my=view.y+py*view.h;
    const nw=view.w*factor, nh=view.h*factor;
    setView({x:mx-px*nw,y:my-py*nh,w:nw,h:nh});
  }
  select.addEventListener('change', () => { fitMode='net'; choose(select.value); });
  document.querySelectorAll('button[data-group]').forEach(btn => btn.addEventListener('click', () => { group=btn.dataset.group; document.querySelectorAll('button[data-group]').forEach(b => b.setAttribute('aria-pressed', String(b===btn))); rebuildSelect(selectedName); }));
  document.getElementById('fitNet').addEventListener('click', () => { fitMode='net'; fitSelected(); });
  document.getElementById('fitAll').addEventListener('click', () => { fitMode='all'; fitWhole(); });
  document.getElementById('zoomIn').addEventListener('click', () => { const r=svg.getBoundingClientRect(); zoomAt(.72, r.left+r.width/2, r.top+r.height/2); });
  document.getElementById('zoomOut').addEventListener('click', () => { const r=svg.getBoundingClientRect(); zoomAt(1.38, r.left+r.width/2, r.top+r.height/2); });
  svg.addEventListener('wheel', ev => { ev.preventDefault(); zoomAt(ev.deltaY < 0 ? .82 : 1.22, ev.clientX, ev.clientY); }, {passive:false});
  let drag=null;
  svg.addEventListener('pointerdown', ev => { drag={x:ev.clientX,y:ev.clientY,view:{...view}}; svg.setPointerCapture(ev.pointerId); svg.classList.add('dragging'); });
  svg.addEventListener('pointermove', ev => { if (!drag) return; const rect=svg.getBoundingClientRect(); const dx=(ev.clientX-drag.x)/rect.width*drag.view.w; const dy=(ev.clientY-drag.y)/rect.height*drag.view.h; setView({x:drag.view.x-dx,y:drag.view.y-dy,w:drag.view.w,h:drag.view.h}); });
  svg.addEventListener('pointerup', () => { drag=null; svg.classList.remove('dragging'); });
  svg.addEventListener('pointercancel', () => { drag=null; svg.classList.remove('dragging'); });
  window.addEventListener('resize', () => { if (fitMode === 'net') fitSelected(); else fitWhole(); });
  rebuildSelect(selectedName);
})();
</script>
</body>
</html>
